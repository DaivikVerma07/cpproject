<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SaaS Analytics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* SaaS Color Palette & Typography */
        :root {
            --bg-color: #F8FAFC; /* Soft Slate */
            --card-bg: #FFFFFF;
            --primary: #4F46E5; /* Indigo */
            --primary-hover: #4338CA;
            --text-main: #1E293B; /* Dark Slate */
            --text-muted: #64748B;
            --border: #E2E8F0;
        }
        
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-color); color: var(--text-main); margin: 0; padding: 30px; }
        h1, h2, h3 { margin-top: 0; color: var(--text-main); }
        
        .card { background: var(--card-bg); border-radius: 12px; padding: 24px; margin-bottom: 24px; border: 1px solid var(--border); box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        
        /* Upload Area */
        .upload-area { display: flex; gap: 15px; align-items: center; }
        input[type="file"] { border: 1px solid var(--border); padding: 8px; border-radius: 6px; color: var(--text-muted); }
        button { background: var(--primary); color: white; border: none; padding: 10px 18px; border-radius: 6px; font-weight: 600; cursor: pointer; transition: 0.2s; }
        button:hover { background: var(--primary-hover); }

        /* Grid Layouts */
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 24px; }
        .grid-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 24px;}
        
        /* Dynamic Subject Cards */
        .stat-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 15px; text-align: center; border-top: 4px solid var(--primary); transition: transform 0.2s;}
        .stat-card:hover { transform: translateY(-3px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .stat-card h3 { font-size: 1.1em; margin-bottom: 5px; }
        .stat-card p { margin: 5px 0; color: var(--text-muted); font-size: 0.9em; }
        .stat-card .avg { font-size: 1.5em; color: var(--text-main); font-weight: bold; margin: 10px 0; }

        /* Interactive Table */
        .table-controls { display: flex; justify-content: space-between; margin-bottom: 15px; }
        .table-controls input { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; width: 250px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background: #F1F5F9; font-weight: 600; cursor: pointer; user-select: none; }
        th:hover { background: #E2E8F0; }
        
        #results { display: none; }
        .chart-container { position: relative; height: 300px; width: 100%; }
    </style>
</head>
<body>

    <div>
        <h1>Class Performance Analytics</h1>
        <p style="color: var(--text-muted);">SaaS Educational Dashboard</p>
    </div>

    <div class="card upload-area">
        <form id="upload-form" style="display:flex; gap:15px; width:100%;">
            <input type="file" id="file-input" accept=".csv, .xlsx" required>
            <button type="submit">Generate Insights</button>
        </form>
    </div>

    <div id="results">
        
        <!-- Subject Stat Cards -->
        <div class="grid-cards" id="subject-cards"></div>

        <!-- Charts Grid -->
        <div class="grid-3">
            <div class="card">
                <h2>Subject Averages</h2>
                <div class="chart-container"><canvas id="barChart"></canvas></div>
            </div>
            <div class="card">
                <h2>Performance Spread (Top vs Avg)</h2>
                <div class="chart-container"><canvas id="radarChart"></canvas></div>
            </div>
            <div class="card">
                <h2>Overall Grade Distribution</h2>
                <div class="chart-container"><canvas id="doughnutChart"></canvas></div>
            </div>
        </div>

        <!-- Interactive Student Table -->
        <div class="card">
            <div class="table-controls">
                <h2>Student Database</h2>
                <input type="text" id="search-input" placeholder="Search by name...">
            </div>
            <table id="student-table">
                <thead id="table-head"></thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        let charts = {};
        let studentData = [];
        let tableColumns = [];

        document.getElementById('upload-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData();
            formData.append('file', document.getElementById('file-input').files[0]);

            fetch('/api/upload', { method: 'POST', body: formData })
            .then(res => res.json())
            .then(data => {
                if(data.error) return alert("Error: " + data.error);
                
                document.getElementById('results').style.display = 'block';
                studentData = data.all_students;
                tableColumns = ['Name', 'Total', ...data.subjects];

                renderSubjectCards(data.subjects, data.subject_stats);
                renderCharts(data);
                renderTableHeaders();
                renderTableBody(studentData);
            });
        });

        // 1. Render Dynamic Cards
        function renderSubjectCards(subjects, stats) {
            const container = document.getElementById('subject-cards');
            container.innerHTML = '';
            subjects.forEach(sub => {
                container.innerHTML += `
                    <div class="stat-card">
                        <h3>${sub}</h3>
                        <div class="avg">${stats[sub]['Average']}</div>
                        <p>Class Average</p>
                        <hr style="border:0; border-top:1px solid #E2E8F0; margin:10px 0;">
                        <p>High: <strong>${stats[sub]['Highest']}</strong> | Low: <strong>${stats[sub]['Lowest']}</strong></p>
                    </div>
                `;
            });
        }

        // 2. Render 3 SaaS Charts
        function renderCharts(data) {
            Object.values(charts).forEach(c => c.destroy()); // clear old charts

            // Bar Chart: Subject Averages
            charts.bar = new Chart(document.getElementById('barChart'), {
                type: 'bar',
                data: {
                    labels: data.subjects,
                    datasets: [{
                        label: 'Average Score',
                        data: data.class_averages,
                        backgroundColor: '#4F46E5',
                        borderRadius: 4
                    }]
                },
                options: { maintainAspectRatio: false }
            });

            // Radar Chart: Top Student vs Average
            charts.radar = new Chart(document.getElementById('radarChart'), {
                type: 'radar',
                data: {
                    labels: data.subjects,
                    datasets: [
                        {
                            label: data.top_student_name + ' (Top)',
                            data: data.top_student_scores,
                            backgroundColor: 'rgba(79, 70, 229, 0.2)',
                            borderColor: '#4F46E5',
                            pointBackgroundColor: '#4F46E5'
                        },
                        {
                            label: 'Class Average',
                            data: data.class_averages,
                            backgroundColor: 'rgba(100, 116, 139, 0.2)',
                            borderColor: '#64748B',
                        }
                    ]
                },
                options: { maintainAspectRatio: false }
            });

            // Doughnut Chart: Distribution
            charts.doughnut = new Chart(document.getElementById('doughnutChart'), {
                type: 'doughnut',
                data: {
                    labels: Object.keys(data.distribution),
                    datasets: [{
                        data: Object.values(data.distribution),
                        backgroundColor: ['#EF4444', '#F59E0B', '#10B981'], // Red, Yellow, Green
                        borderWidth: 0
                    }]
                },
                options: { maintainAspectRatio: false, cutout: '70%' }
            });
        }

        // 3. Interactive Table Logic
        function renderTableHeaders() {
            const tr = document.createElement('tr');
            tableColumns.forEach(col => {
                const th = document.createElement('th');
                th.innerText = col + ' ↕';
                th.onclick = () => sortTable(col);
                tr.appendChild(th);
            });
            document.getElementById('table-head').innerHTML = '';
            document.getElementById('table-head').appendChild(tr);
        }

        function renderTableBody(dataArray) {
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';
            dataArray.forEach(row => {
                const tr = document.createElement('tr');
                tableColumns.forEach(col => {
                    tr.innerHTML += `<td>${row[col]}</td>`;
                });
                tbody.appendChild(tr);
            });
        }

        // Search Filter
        document.getElementById('search-input').addEventListener('input', function(e) {
            const term = e.target.value.toLowerCase();
            const filtered = studentData.filter(s => s.Name.toLowerCase().includes(term));
            renderTableBody(filtered);
        });

        // Sort Data
        let sortAsc = false;
        function sortTable(column) {
            sortAsc = !sortAsc;
            studentData.sort((a, b) => {
                if(a[column] < b[column]) return sortAsc ? -1 : 1;
                if(a[column] > b[column]) return sortAsc ? 1 : -1;
                return 0;
            });
            renderTableBody(studentData);
        }
    </script>
</body>
</html>
